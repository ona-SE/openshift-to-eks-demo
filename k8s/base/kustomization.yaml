apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base set of standard Kubernetes manifests migrated from the OpenShift
# orchestrator descriptors in legacy-openshift/. Environment-specific overlays
# in ../overlays patch image, replicas, hostnames, and scaling.
namespace: task-manager

# Descriptive labels only (includeSelectors: false) so the immutable
# Deployment/Service selectors defined in the manifests stay stable.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: task-manager
      app.kubernetes.io/part-of: task-manager

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
