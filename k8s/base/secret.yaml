# Secret reference placeholder.
#
# The current application (app/app.py) has NO secret dependencies — it uses
# in-memory storage and reads only PORT from the environment. This manifest is
# intentionally a scaffold so that future secrets (DB credentials, API keys)
# have a defined home and the Deployment's envFrom reference resolves.
#
# Do NOT commit real secret values. Populate this out-of-band using one of:
#   - kubectl create secret generic task-manager-secrets --from-literal=KEY=VALUE -n task-manager
#   - External Secrets Operator / AWS Secrets Manager (recommended on EKS)
#   - Sealed Secrets
#
# TODO(human review): Replace this empty Opaque secret with a real secret source
# when the application gains sensitive configuration.
apiVersion: v1
kind: Secret
metadata:
  name: task-manager-secrets
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-manager
type: Opaque
stringData: {}
