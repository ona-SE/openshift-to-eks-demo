# Migrated from the OpenShift Route (legacy-openshift/template.yaml -> Route, and
# the Helm route.yaml in the source repo).
#
# Mapping notes:
#   - Route (route.openshift.io/v1) -> Ingress (networking.k8s.io/v1)
#   - The AWS Load Balancer Controller provisions an ALB from this Ingress.
#   - healthcheck-path mirrors the application's /health endpoint.
#
# The original Route used TLS edge termination with HTTP->HTTPS redirect. To
# reproduce that on EKS you must supply an ACM certificate ARN. Until then the
# listener is HTTP only.
#
# TODO(human review): For TLS edge termination equivalent to the OpenShift Route,
# uncomment the HTTPS listener annotations and set a real ACM certificate ARN:
#   alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
#   alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:<region>:<account-id>:certificate/<cert-id>
#   alb.ingress.kubernetes.io/ssl-redirect: '443'
# Also set spec.tls and a real host below.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-manager
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-manager
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: task-manager
                port:
                  number: 8080
