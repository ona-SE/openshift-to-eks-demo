# Secret reference for the Task Manager service.
#
# The migrated application currently has NO sensitive configuration (in-memory
# store, no DB/cache/queue credentials, no API keys). This manifest is a
# placeholder documenting where secrets would live and how they are injected
# through envFrom in k8s/deployment.yaml.
#
# Do NOT commit secret VALUES to git. Populate this Secret out-of-band via one
# of:
#   - kubectl create secret generic task-manager-secrets --from-literal=KEY=VALUE
#   - An external secrets operator (e.g. External Secrets Operator + AWS Secrets
#     Manager / SSM Parameter Store).
#   - Sealed Secrets.
#
# TODO(human-review): If the service gains credentials, populate this object
# externally; the Deployment already references it through envFrom.
apiVersion: v1
kind: Secret
metadata:
  name: task-manager-secrets
  namespace: task-manager
  labels:
    app: task-manager
type: Opaque
data: {}
