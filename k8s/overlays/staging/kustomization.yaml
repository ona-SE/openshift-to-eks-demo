apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging overlay: mirrors prod scaling but pinned to the staging image tag.
namespace: task-manager

resources:
  - ../../base

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: task-manager
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4

# TODO(human review): point at your staging ECR repo / tag.
images:
  - name: task-manager
    newName: <account-id>.dkr.ecr.<region>.amazonaws.com/task-manager
    newTag: staging

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/environment: staging
