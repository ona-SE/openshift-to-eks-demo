apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prod overlay: full autoscaling range (matches the original autoscaling rules:
# min 2, max 5, 80% CPU) and a pinned, immutable image tag.
namespace: task-manager

resources:
  - ../../base

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: task-manager
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5

# TODO(human review): pin to an immutable, promoted image digest/tag for prod
# instead of a moving tag.
images:
  - name: task-manager
    newName: <account-id>.dkr.ecr.<region>.amazonaws.com/task-manager
    newTag: latest

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/environment: prod
