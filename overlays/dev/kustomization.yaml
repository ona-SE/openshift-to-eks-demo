apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev environment: single replica, no autoscaling. Image tag pinned to a dev
# build; replace the newTag/newName with your registry values.
namespace: task-manager

resources:
  - ../../k8s

namePrefix: dev-

labels:
  - pairs:
      environment: dev
    includeSelectors: false

replicas:
  - name: task-manager
    count: 1

images:
  - name: task-manager
    # TODO(human-review): point at your dev registry/repo.
    newName: task-manager
    newTag: dev
