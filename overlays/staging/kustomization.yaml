apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging environment: 2 replicas with autoscaling enabled (base HPA: 2-5, 80%).
namespace: task-manager

resources:
  - ../../k8s

components:
  - ../../components/autoscaling

namePrefix: staging-

labels:
  - pairs:
      environment: staging
    includeSelectors: false

replicas:
  - name: task-manager
    count: 2

images:
  - name: task-manager
    # TODO(human-review): point at your staging registry/repo.
    newName: task-manager
    newTag: staging
