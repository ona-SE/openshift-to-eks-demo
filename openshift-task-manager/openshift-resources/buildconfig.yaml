# DEPRECATED: Migrated to standard Kubernetes.
# OpenShift BuildConfig (in-cluster builds) is replaced by an external CI/CD
# build of the Dockerfile at openshift-task-manager/Dockerfile, pushing to a
# container registry (ECR). See k8s/ for the active deployment path.
# Kept for reference only; do not deploy.
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: task-manager
  namespace: task-manager
  labels:
    app: task-manager
spec:
  output:
    to:
      kind: ImageStreamTag
      name: task-manager:latest
  source:
    type: Git
    git:
      uri: https://github.com/example/task-manager.git
      ref: main
    contextDir: /
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  triggers:
    - type: ConfigChange
    - type: ImageChange
  runPolicy: Serial

